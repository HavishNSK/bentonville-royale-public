# BENTONVILLE ROYALE — multiplayer / party / matchmaking / account servers on Cloudflare
# (PartyServer on Durable Objects; hosted PartyKit shut down on 23 Oct 2026).
#
#   npm run party:dev      local servers on http://localhost:1999 (the game's default)
#   npx wrangler login     once, with the Cloudflare account that will host them
#   npm run party:deploy   -> https://bentonville-royale.<your-subdomain>.workers.dev
# Then set VITE_PARTYKIT_HOST=bentonville-royale.<your-subdomain>.workers.dev in Vercel.

name = "bentonville-royale"
main = "party/worker.js"
compatibility_date = "2025-09-01"

[dev]
port = 1999

[[durable_objects.bindings]]
name = "Main"
class_name = "Main"

[[durable_objects.bindings]]
name = "Party"
class_name = "Party"

[[durable_objects.bindings]]
name = "Matchmaker"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "Accounts"
class_name = "Accounts"

# SQLite-backed Durable Objects (the free plan's kind)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Main", "Party", "Matchmaker", "Accounts"]
