<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Skin lab — Bentonville Royale</title>
<!--
  Dev-only outfit lab (not part of the production build: vite builds index.html only).
    /skinlab.html?skin=skin_rogue          turnaround of a catalog skin
    /skinlab.html?recipe=<base64url JSON>  turnaround of an inline recipe
    /skinlab.html?swatches=player          a kit's atlas, cells and regions labelled
    /skinlab.html?probe=player             every atlas cell of a kit painted magenta in turn
    /skinlab.html?all=1                    contact sheet of every catalog skin
  Rendered to PNG by tools/skins/render.mjs (see tools/skins/README.md).
-->
<style>
  @font-face { font-family: 'Lilita One'; src: url('/assets/fonts/LilitaOne-Regular.woff2') format('woff2'); font-display: block; }
  @font-face { font-family: 'Nunito'; src: url('/assets/fonts/Nunito-Variable.woff2') format('woff2'); font-weight: 200 1000; font-display: block; }
  :root {
    --ink: #1b1d24;
    --violet: #3a2c8f;
    --gold: #ffc21f;
    --cream: #fff1d6;
    --backdrop: #d8d3c8;
    --muted: #6b6559;
  }
  html, body { margin: 0; background: var(--backdrop); color: var(--ink); font-family: 'Nunito', system-ui, sans-serif; }
  #sheet { display: inline-block; position: relative; background: var(--backdrop); }
  .bar { display: flex; align-items: baseline; gap: 14px; padding: 12px 18px; background: var(--ink); color: var(--cream); }
  .bar h1 { margin: 0; font: 400 30px/1 'Lilita One', sans-serif; letter-spacing: 0.01em; }
  .bar .id { font: 700 14px/1 'Nunito', sans-serif; opacity: 0.7; }
  .bar .meta { margin-left: auto; white-space: pre-line; font: 700 13px/1.3 'Nunito', sans-serif; opacity: 0.85; text-align: right; }
  .pill { font: 400 15px/1 'Lilita One', sans-serif; padding: 4px 10px 3px; border-radius: 999px; color: var(--ink); text-transform: uppercase; }
  .r-common { background: #c9c3b6; } .r-uncommon { background: #7ed37a; } .r-rare { background: #6cc4ff; }
  .r-epic { background: #c08bff; } .r-legendary { background: var(--gold); }
  .views { position: relative; }
  .tag { position: absolute; top: 8px; font: 400 15px/1 'Lilita One', sans-serif; color: var(--muted); text-transform: uppercase; }
  .notes { padding: 8px 18px 12px; font: 600 13px/1.4 'Nunito', sans-serif; color: #8a1c1c; white-space: pre-wrap; }
  .notes:empty { display: none; }
  .cap { position: absolute; text-align: center; font: 700 13px/1.2 'Nunito', sans-serif; }
  .cap b { display: block; font: 400 16px/1.1 'Lilita One', sans-serif; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="sheet"></div>
<script type="module" src="/src/dev/skinLab.js"></script>
</body>
</html>
